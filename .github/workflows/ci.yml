name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        run: python -m pip install -e "intent-hub-backend[dev]"

      - name: Install CLI
        run: python -m pip install -e "intent-hub-cli[dev]"

      - name: Backend tests
        run: pytest intent-hub-backend/tests -q

      - name: CLI tests
        run: pytest intent-hub-cli/tests -q

      - name: Repository tests
        run: pytest tests -q

      - name: API docs check
        run: python -m scripts.api_docs check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: intent-hub-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: intent-hub-frontend
        run: npm ci

      - name: Frontend build
        working-directory: intent-hub-frontend
        run: npm run build
