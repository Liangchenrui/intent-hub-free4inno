services:
  backend:
    build:
      context: ./intent-hub-backend
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE=${PYTHON_BASE:-ghcr.io/astral-sh/uv:python3.11-bookworm-slim}
        - PIP_INDEX_URL=${PIP_INDEX_URL}
    container_name: intent-hub-backend
    environment:
      API_COMPAT_PROFILE: ${API_COMPAT_PROFILE:-master}
      SOURCE_INSTANCE: ${SOURCE_INSTANCE:-default}
      AUTH_CODE: ${AUTH_CODE:-}
      API_KEYS: ${API_KEYS:-}
      PREDICT_AUTH_KEY: ${PREDICT_AUTH_KEY:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      AGENT_API_URL: ${AGENT_API_URL:-}
      AGENT_API_LABEL_IDS: ${AGENT_API_LABEL_IDS:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    image: ${IMAGE_PREFIX}intent-hub-backend:latest
    volumes:
      - ./intent-hub-backend/intent_hub:/app/intent_hub
      - ./intent-hub-backend/data:/app/data
    ports:
      - "8000:5000"
    networks:
      - intent-hub-net

  frontend:
    build:
      context: ./intent-hub-frontend
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE=${NODE_BASE:-node:20-alpine}
        - NGINX_BASE=${NGINX_BASE:-nginx:alpine}
        - NPM_REGISTRY=${NPM_REGISTRY}
    container_name: intent-hub-frontend
    image: ${IMAGE_PREFIX}intent-hub-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - intent-hub-net

networks:
  intent-hub-net:
    driver: bridge
