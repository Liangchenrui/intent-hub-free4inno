openapi: 3.1.0
info:
  title: 历史路由接口存档（已停用）
  version: 0.3.0
  summary: BUPT 语义路由契约：输入 query，返回 success/data/error 信封
  description: 此文件仅保留历史记录，不代表当前接口。新版请使用 docs/api/routing-api.openapi.yaml，唯一入口 POST
    /route。
  contact:
    name: Intent Hub Team
servers:
- url: https://{host}
  description: 生产部署地址由部署方填写；本仓库不含固定公网域名
  variables:
    host:
      default: intent-hub.example.com
- url: http://localhost:8000
  description: 按 docker-compose.yml 发布的宿主机端口（后端直连）
- url: http://localhost:5000
  description: 本地直接运行后端时的默认地址
- url: http://localhost/api
  description: 经内置前端 Nginx 反代（/api 前缀会被剥离后转发到后端）
tags:
- name: 路由预测
  description: BUPT `/route` 契约，返回 success/data/error 信封
- name: 探针
  description: BUPT 命名空间下的存活与依赖健康检查
paths:
  /compat/bupt/route:
    post:
      tags:
      - 路由预测
      summary: 语义路由预测（BUPT 契约，稳定前缀入口）
      operationId: compatBuptRoute
      description: '输入 `query`，返回 `success/data/error` 信封。


        - 命中（`matched=true`）时 `agents` 按 `score` 降序给出所有达标 Agent，`text` 为 `null`。

        - 未命中（`matched=false`）时 `agents` 为空数组，`text` 返回部署配置的默认文本（缺省 `没有找到合适的 Agent`，可由
        `data/default_route.txt` 覆盖）。

        - `data.agents[].agent` 是该 Agent 的原始 `details` 载荷，字段由数据来源决定，同一部署内可能不稳定，也可能是空对象；不要按固定字段解析。

        - `match_source` 与 `fallback_status` 取排序后第一条结果的口径，即最高分命中者（或兜底结果）。

        - 组件预热中或预热失败返回 503 `SERVICE_NOT_READY`；其他运行异常返回 500 `INTERNAL_ERROR`，不暴露内部详情。

        '
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            examples:
              basic:
                summary: 常规请求
                value:
                  query: 帮我查一下订单物流
              scoped:
                summary: 同时指定 Collection 和上游源（示例值需替换）
                value:
                  query: 帮我查一下订单物流
                  collection: intent_hub
                  upstream_id: orders-platform
      responses:
        '200':
          description: 统一信封响应；命中与否都返回 HTTP 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteEnvelope'
              examples:
                matched:
                  summary: 命中一个 Agent
                  value:
                    success: true
                    data:
                      matched: true
                      agents:
                      - agent:
                          id: 71
                          title: 订单物流查询
                        score: 0.93
                      text: null
                      match_source: semantic
                      fallback_status: null
                    error: null
                multiMatch:
                  summary: 命中多条（按 score 降序）
                  value:
                    success: true
                    data:
                      matched: true
                      agents:
                      - agent:
                          id: 71
                          title: 订单物流查询
                        score: 0.93
                      - agent:
                          id: 76
                          title: 退款进度查询
                        score: 0.84
                      text: null
                      match_source: semantic
                      fallback_status: null
                    error: null
                noMatch:
                  summary: 未命中且未启用兜底
                  value:
                    success: true
                    data:
                      matched: false
                      agents: []
                      text: 没有找到合适的 Agent
                      match_source: default
                      fallback_status: null
                    error: null
                fallbackMatched:
                  summary: LLM 兜底命中（score 为 null）
                  value:
                    success: true
                    data:
                      matched: true
                      agents:
                      - agent:
                          id: 74
                          title: 电子发票申请补开
                        score: null
                      text: null
                      match_source: llm_fallback
                      fallback_status: matched
                    error: null
                ambiguous:
                  summary: 兜底判定为歧义，建议提示用户澄清
                  value:
                    success: true
                    data:
                      matched: false
                      agents: []
                      text: 没有找到合适的 Agent
                      match_source: default
                      fallback_status: ambiguous
                    error: null
        '400':
          $ref: '#/components/responses/BuptBadRequest'
        '401':
          $ref: '#/components/responses/BuptUnauthorized'
        '503':
          $ref: '#/components/responses/BuptNotReady'
        '500':
          $ref: '#/components/responses/BuptInternalError'
      deprecated: true
  /route:
    post:
      tags:
      - 路由预测
      summary: 语义路由预测（BUPT 契约，无前缀别名）
      operationId: route
      description: '与 `POST /compat/bupt/route` 完全相同的请求与响应契约（同一个视图函数）。

        该路径不与 master 路径冲突，因此在任何 `API_COMPAT_PROFILE` 下都由 BUPT 契约处理。

        '
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: 同 `POST /compat/bupt/route`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteEnvelope'
        '400':
          $ref: '#/components/responses/BuptBadRequest'
        '401':
          $ref: '#/components/responses/BuptUnauthorized'
        '503':
          $ref: '#/components/responses/BuptNotReady'
        '500':
          $ref: '#/components/responses/BuptInternalError'
      deprecated: true
  /compat/bupt/health:
    get:
      tags:
      - 探针
      summary: BUPT 命名空间存活探针
      operationId: compatBuptHealth
      description: 免鉴权。仅表示 Flask 进程存活，不代表向量库与 Embedding 可用。
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
              examples:
                ok:
                  value:
                    status: ok
      deprecated: true
  /compat/bupt/health/services:
    get:
      tags:
      - 探针
      summary: BUPT 命名空间依赖健康检查
      operationId: compatBuptServiceHealth
      description: '需要 `AUTH_CODE` 鉴权。返回 Embedding 与 Qdrant 的探活结果，任一不健康则整体 `status=degraded`。

        该响应会暴露依赖服务健康信息，仅应向受信任的调用方开放。

        '
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: 依赖健康汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalServiceHealth'
              examples:
                degraded:
                  value:
                    status: degraded
                    services:
                      embedding:
                        healthy: true
                        status_code: 200
                        latency_ms: 42
                        message: ok
                      qdrant:
                        healthy: false
                        status_code: null
                        latency_ms: 5001
                        message: connection failed
        '401':
          $ref: '#/components/responses/BuptUnauthorized'
      deprecated: true
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <key>`，路由接口的 `<key>` 为已保存的 `ROUTE_API_KEY`，未设置则为环境变量
        `AUTH_CODE`；管理接口仍使用 `AUTH_CODE`。'
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 与 `BearerAuth` 等价的备用传递方式，取值规则同 BearerAuth。
  responses:
    BuptBadRequest:
      description: 请求参数错误（`query` 缺失、为空字符串或仅含空白）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteEnvelope'
          examples:
            emptyQuery:
              value:
                success: false
                data: null
                error:
                  code: INVALID_REQUEST
                  message: 请求参数错误
                  detail: query 不能为空
    BuptUnauthorized:
      description: 认证失败（缺少或错误的有效密钥；未配置有效密钥时同样返回此响应）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteEnvelope'
          examples:
            unauthorized:
              value:
                success: false
                data: null
                error:
                  code: UNAUTHORIZED
                  message: Authentication failed
                  detail: null
    BuptNotReady:
      description: 路由组件预热中或暂不可用，请稍后重试
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteEnvelope'
          example:
            success: false
            data: null
            error:
              code: SERVICE_NOT_READY
              message: 路由组件预热中或暂不可用，请稍后重试
              detail: null
    BuptInternalError:
      description: 服务运行异常，详情不向外暴露
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteEnvelope'
          examples:
            internalError:
              value:
                success: false
                data: null
                error:
                  code: INTERNAL_ERROR
                  message: 服务异常
                  detail: null
  schemas:
    RouteRequest:
      type: object
      description: 多余字段会被忽略，不会因此报错；`query` 缺失、为空字符串或仅含空白返回 400。
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          description: 待匹配的用户文本
          examples:
          - 帮我查一下订单物流
        collection:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 255
          description: 本次检索的现有 Qdrant collection；省略或 null 使用服务默认配置，不存在返回 400。
        upstream_id:
          type:
          - string
          - 'null'
          minLength: 1
          description: 上游稳定 ID（source.instance），不是名称或 Agent 原始 ID；省略或 null 不限来源，无匹配来源返回未命中。
    RouteEnvelope:
      type: object
      required:
      - success
      - data
      - error
      description: BUPT 统一信封；失败时 `data` 为 `null`
      properties:
        success:
          type: boolean
        data:
          oneOf:
          - $ref: '#/components/schemas/RouteData'
          - type: 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/ApiError'
          - type: 'null'
    RouteData:
      type: object
      required:
      - matched
      - agents
      - text
      - match_source
      - fallback_status
      properties:
        matched:
          type: boolean
          description: 是否存在非 `default` 的命中结果；LLM 兜底命中同样为 `true`
        agents:
          type: array
          description: 命中的 Agent 列表，按 `score` 降序；未命中时为空数组
          items:
            $ref: '#/components/schemas/RouteAgentMatch'
        text:
          type:
          - string
          - 'null'
          description: 仅未命中时返回默认文本；命中时为 `null`
        match_source:
          type: string
          enum:
          - semantic
          - llm_fallback
          - default
          description: 取值含义：`semantic` 例句匹配；`llm_fallback` LLM 兜底选中；`default` 默认结果
        fallback_status:
          type:
          - string
          - 'null'
          enum:
          - matched
          - no_match
          - ambiguous
          - no_candidates
          - unavailable
          - null
          description: 未触发兜底时为 `null`；`ambiguous` 建议调用方提示用户澄清（服务端不会自动发起多轮对话）
    RouteAgentMatch:
      type: object
      required:
      - agent
      - score
      properties:
        agent:
          type: object
          description: 原始 Agent `details` 载荷；字段由数据来源决定，可能为空对象，不作为稳定契约使用
          additionalProperties: true
        score:
          type:
          - number
          - 'null'
          description: 例句向量相似度；LLM 兜底命中为 `null`
    ApiError:
      type: object
      required:
      - code
      - message
      - detail
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHORIZED
          - INTERNAL_ERROR
        message:
          type: string
        detail:
          type:
          - string
          - 'null'
    LivenessResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    ExternalServiceHealth:
      type: object
      required:
      - status
      - services
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        services:
          type: object
          properties:
            embedding:
              $ref: '#/components/schemas/ServiceProbe'
            qdrant:
              $ref: '#/components/schemas/ServiceProbe'
    ServiceProbe:
      type: object
      required:
      - healthy
      - status_code
      - latency_ms
      - message
      properties:
        healthy:
          type: boolean
        status_code:
          type:
          - integer
          - 'null'
        latency_ms:
          type: integer
        message:
          type: string
