[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-hub-cli"
version = "0.1.1"
description = "Lightweight CLI and SDK for remote Intent Hub APIs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/free4inno/intent-hub"
Repository = "https://github.com/free4inno/intent-hub"
Documentation = "https://github.com/free4inno/intent-hub/blob/main/intent-hub-cli/README.md"

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=7.0.0",
    "twine>=5.0.0",
]

[project.scripts]
intent-hub = "intent_hub_cli.cli:main"
intenthub = "intent_hub_cli.cli:main"

[tool.setuptools.packages.find]
include = ["intent_hub_cli*"]

[tool.pytest.ini_options]
addopts = "--basetemp=.tmp/pytest -p no:cacheprovider"
testpaths = ["tests"]
